name: spatial-verse-cms

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    environment:
      APOS_DB_URI: sqlite://data/spatial-verse-cms.sqlite
      APOS_EXTERNAL_FRONT_KEY: ${APOS_EXTERNAL_FRONT_KEY:-dev}
      APOS_SESSION_SECRET: ${APOS_SESSION_SECRET:-local-docker-session-secret-change-me}
      NODE_ENV: development
      PORT: 3000
    init: true
    ports:
      - "3000:3000"
    volumes:
      # Bind mounts preserve the restored database, its WAL files and uploads
      # outside the container lifecycle while keeping them easy to back up.
      - type: bind
        source: ./backend/data
        target: /app/backend/data
      - type: bind
        source: ./backend/public/uploads
        target: /app/backend/public/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => { if (r.status >= 500) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    environment:
      APOS_HOST: http://backend:3000
      APOS_EXTERNAL_FRONT_KEY: ${APOS_EXTERNAL_FRONT_KEY:-dev}
      NODE_ENV: development
      PORT: 4321
    depends_on:
      backend:
        condition: service_healthy
    init: true
    ports:
      - "4321:4321"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321').then(r => { if (r.status >= 500) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
