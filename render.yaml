services:
  - type: web
    name: spatial-verse-cms
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    # Build again in the runtime filesystem. Render has occasionally started
    # this service without the gitignored Apostrophe asset artifacts produced
    # in its build phase, which leaves /login as an empty shell.
    startCommand: npm run serve
    envVars:
      - key: NODE_ENV
        value: production
      - key: APOS_DB_URI
        sync: false
      - key: APOS_EXTERNAL_FRONT_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
