# Install on the server as /etc/nginx/sites-available/spatial-verse-cms.
# Replace example.com and www.example.com before enabling the configuration.
# HTTPS is added by Certbot after the HTTP site has been verified.

server {
  listen 80;
  listen [::]:80;
  server_name example.com www.example.com;

  # Do not expose a directory listing if an operator opens /poster/.
  autoindex off;
  client_max_body_size 100m;

  # Normalise the poster root URL so relative links in a poster work reliably.
  location = /poster {
    return 301 /poster/;
  }

  # This route is served directly by Nginx. It never reaches Astro or
  # ApostropheCMS, so new posters do not require a Docker rebuild or CMS change.
  # /poster/autumn/ maps to /var/www/posters/autumn/index.html.
  location ^~ /poster/ {
    alias /var/www/posters/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # The application remains behind Nginx. Docker only publishes 4321 on the
  # server loopback interface, not on the public network.
  location / {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
